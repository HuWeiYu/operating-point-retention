# Conda recipe for the audited INP-Former operating-point-retention release.
#
# mirrors the environment the paper runs were produced with (env-A / env-B).
#   conda env create -f environment.yml
#   conda activate inp-opret
#
# The CUDA build is pinned to cu124 (PyTorch 2.5.1). On the env-B machine the same code
# ran under torch 2.8.0+cu128; either works for this public package.
name: inp-opret
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # deep learning / GPU
  - pytorch=2.5.1
  - torchvision=0.20.1
  - pytorch-cuda=12.4
  # numeric / imaging / plotting
  - numpy=2.4.6
  - scipy=1.17.1
  - pandas=3.0.5
  - scikit-learn=1.9.0
  - scikit-image=0.26.0
  - matplotlib=3.11.1
  - timm=1.0.28
  - kornia=0.8.3
  - tqdm
  - pyyaml
  - pytest
  - pip:
      - ADEval==1.1.0
      - opencv-python-headless==5.0.0.93
